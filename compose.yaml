services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      # Перекрывает Windows-путь, даже если скопировали локальный .env.
      POPPLER_PATH: ""
      JUDICIAL_DB_PATH: /app/storage/documents.sqlite3
      JUDICIAL_STORAGE_DIR: /app/storage
      EASYOCR_MODULE_PATH: /app/data/cache/easyocr
      PDF_EXTRACTOR_OCR_USE_GPU: "false"
      PDF_EXTRACTOR_ENABLE_TABLE_EXTRACTION: "false"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./data/cache/easyocr:/app/data/cache/easyocr
    restart: unless-stopped
