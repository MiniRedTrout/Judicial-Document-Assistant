[project]
name = "hackathon"
version = "0.1.0"
description = "ДЭЛО: обработка судебных PDF и XML ФССП"
authors = [{ name = "Команда хакатона", email = "team@example.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi==0.142.2", "uvicorn==0.54.0", "python-multipart==0.0.32",
    "pydantic==2.13.5", "pydantic-settings>=2.0,<3", "python-dotenv>=1.0,<2",
    "pandas==3.0.6", "numpy>=1.26,<3", "pdfplumber>=0.11,<0.12",
    "pdf2image>=1.17,<2", "Pillow>=10,<13", "loguru>=0.7,<0.8",
    "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
ocr = ["easyocr==1.7.2"]
tables = ["camelot-py>=1.0,<2"]

[tool.poetry]
packages = [{ include = "app" }, { include = "src" }, { include = "scripts" }]
include = [
    { path = "app/static/**", format = ["sdist", "wheel"] },
    { path = "src/llm/prompt.txt", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"